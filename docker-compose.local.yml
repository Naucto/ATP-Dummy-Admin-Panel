# A run on a laptop, where nothing routes by domain:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# The console is then on http://localhost:3002.

services:
  dummy-admin:
    ports:
      - "3002:80"

  # USERNAME and PASSWORD of an admin account of your own, from .env (see .env.example). The file
  # is handed to the container as it is: compose would otherwise fill in the USERNAME of the
  # shell, which Windows sets to the name of the session.
  dummy-seed:
    env_file:
      - path: .env
        required: false
    environment:
      EDGE_ENDPOINT: http://localhost:9002/naucto-dummy

  dummy-backend:
    environment:
      EDGE_ENDPOINT: http://localhost:9002/naucto-dummy

  # Covers and releases, at the address EDGE_ENDPOINT names. Not 9000, which the Backend's own
  # development stack publishes its storage on.
  dummy-storage:
    ports:
      - "9002:9000"
